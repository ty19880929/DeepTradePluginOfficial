plugin_id: accumulation-probe-washout
name: 吸筹试盘洗盘主升浪策略
version: 0.7.10
type: strategy
api_version: "1"
entrypoint: accumulation_probe_washout.plugin:AccumulationProbeWashoutPlugin
description: 沪深主板吸筹建仓、天量试盘、洗盘震仓后的主升浪启动预测
author: DeepTrade

# v0.4.0 框架起：插件自行声明非框架自带的运行时依赖（PEP 508）。
# D1：首版即引入 pyarrow 与 VA 对齐，为 v0.2 lgb 快照复用做准备。
dependencies:
  - "tushare>=1.4"
  - "pandas>=2.2,<3"
  - "pyarrow>=15"
  - "lightgbm>=4.3,<5"
  - "scikit-learn>=1.4,<2"

permissions:
  tushare_apis:
    required:
      - stock_basic
      - trade_cal
      - daily
      - daily_basic
      - stock_st
      - moneyflow
    optional:
      - suspend_d
      - index_daily
      - limit_list_d
      - limit_cpt_list
      - top_list
      - adj_factor
    # v0.7.10+：框架 API_CACHE_CLASS 未覆盖的 API 显式声明 cache 策略。
    # index_daily 盘后定型、不回溯修改，与框架默认 fallback 一致。
    cache_overrides:
      index_daily: trade_day_immutable
  llm: true
  llm_tools: false

migrations:
  - version: "20260601_001"
    file: migrations/20260601_001_init.sql
    checksum: "sha256:d89172fb8de27d209888cb4d79d2e581b4c52a59b40745fcede2b31caee36704"
  - version: "20260602_001"
    file: migrations/20260602_001_dimension_cols.sql
    checksum: "sha256:69869d49f542b3ef946a55b7e2ff39b1eb81ad79865cca339bd13baaa6cc0a70"
  - version: "20260602_002"
    file: migrations/20260602_002_apw_lgb_models.sql
    checksum: "sha256:3a19a867d25b4eee9188d626d7f1f6c13e1b5364fbef5dd33161d2ad5c37b98e"
  - version: "20260602_003"
    file: migrations/20260602_003_apw_lgb_predictions.sql
    checksum: "sha256:9a8d4117a31ab232d7614842d8e0c84a94504f408cec5b8b521f908076c725e5"

# 框架 v0.4+ 会从 plugin_id 推导默认前缀；此处显式声明匹配实际表名。
table_prefix: apw_

tables:
  - name: apw_watchlist
    description: 当前待观察标的（PK=ts_code，一只股票一行）
    purge_on_uninstall: true
  - name: apw_signal_history
    description: 每日吸筹试盘洗盘筛选命中明细
    purge_on_uninstall: true
  - name: apw_stage_results
    description: LLM 主升浪启动分析结果
    purge_on_uninstall: true
  - name: apw_runs
    description: 本插件 run 历史（替代框架 strategy_runs）
    purge_on_uninstall: true
  - name: apw_events
    description: 本插件 run 事件流（替代框架 strategy_events）
    purge_on_uninstall: true
  - name: apw_realized_returns
    description: 事后 T+N 实际收益（PK=signal_date+ts_code）
    purge_on_uninstall: true
  - name: apw_config
    description: 本插件用户可调设置
    purge_on_uninstall: true
  - name: apw_lgb_models
    description: LightGBM 主升浪启动概率模型注册表（v0.5.0+）
    purge_on_uninstall: true
  - name: apw_lgb_predictions
    description: 每次 analyze run 的 LGB 推理审计（v0.6.0+）
    purge_on_uninstall: true
